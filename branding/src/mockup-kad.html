<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Russo;src:url(fonts/Russo_One.ttf)}
@font-face{font-family:Saira;font-weight:500;src:url(fonts/Saira_Condensed_wght_500.ttf)}
@font-face{font-family:Saira;font-weight:800;src:url(fonts/Saira_Condensed_wght_800.ttf)}
@font-face{font-family:Mont;font-weight:600;src:url(fonts/Montserrat_wght_600.ttf)}
@font-face{font-family:Mont;font-weight:800;src:url(fonts/Montserrat_wght_800.ttf)}
:root{--navy:#0A1A33;--red:#E10600}
body{margin:0;background:#111}
#stage{width:1600px;height:1100px;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 35% 30%,#4a4f57 0%,#2a2d33 45%,#141518 100%)}
#stage::before{content:"";position:absolute;inset:0;opacity:.35;mix-blend-mode:overlay;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.persp{position:absolute;inset:0;perspective:2200px}
.card{position:absolute;width:700px;height:400px;border-radius:10px;overflow:hidden;transform-style:preserve-3d}
.shadow{box-shadow:0 2px 2px rgba(0,0,0,.35),0 30px 50px rgba(0,0,0,.55),0 60px 90px rgba(0,0,0,.35)}
.front{left:170px;top:150px;background:var(--navy);transform:rotateX(38deg) rotateZ(-16deg)}
.back{left:720px;top:470px;background:#f7f7f5;transform:rotateX(38deg) rotateZ(-9deg)}
.sheen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 40%,rgba(0,0,0,.12) 100%)}
/* front */
.front .lines{position:absolute;inset:0;opacity:.07;
  background:repeating-linear-gradient(-60deg,#fff 0 2px,transparent 2px 22px)}
.front .stripe{position:absolute;right:-80px;bottom:-60px;width:380px;height:70px;background:var(--red);transform:rotate(-30deg)}
.front .stripe2{position:absolute;right:-80px;bottom:10px;width:380px;height:10px;background:#fff;opacity:.9;transform:rotate(-30deg)}
.front img{position:absolute;left:50%;top:48%;width:560px;transform:translate(-50%,-50%)}
/* back */
.back .bar{position:absolute;left:0;right:0;bottom:0;height:46px;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.back .bar span{font:800 22px Saira;color:#fff;letter-spacing:1px}
.back .bar b{font:800 22px Saira;color:var(--red);letter-spacing:1px}
.back .redbar{position:absolute;left:0;top:0;bottom:46px;width:12px;background:var(--red)}
.back .icon{position:absolute;right:30px;top:24px;width:70px}
.back .name{position:absolute;left:52px;top:42px;font:46px Russo;color:var(--navy);transform:skewX(-9deg);letter-spacing:.5px}
.back .name i{font-style:normal;color:var(--red)}
.back .role{position:absolute;left:54px;top:106px;font:500 21px Saira;color:#555;letter-spacing:2.4px}
.back .rule{position:absolute;left:54px;top:146px;width:60px;height:4px;background:var(--red)}
.back ul{position:absolute;left:54px;top:170px;margin:0;padding:0;list-style:none}
.back li{display:flex;align-items:center;gap:14px;font:600 19px Mont;color:var(--navy);height:40px}
.back li svg{width:26px;height:26px;flex:none}
.back .qr{position:absolute;right:40px;top:132px;width:150px;text-align:center}
.back .qr .box{background:#fff;padding:10px;border:3px solid var(--navy);border-radius:8px}
.back .qr img{width:100%;display:block}
.back .qr p{margin:8px 0 0;font:800 16px Saira;color:var(--navy);letter-spacing:1px;line-height:1.1}
.back .qr p em{font-style:normal;color:var(--red)}
</style></head><body>
<div id="stage"><div class="persp">
  <div class="card front shadow sheen">
    <div class="lines"></div><div class="stripe"></div><div class="stripe2"></div>
    <img src="../logo/logo-horizontal-white.svg">
  </div>
  <div class="card back shadow sheen">
    <div class="redbar"></div>
    <img class="icon" src="../logo/icon.svg">
    <div class="name">PROF<i>POJI</i></div>
    <div class="role">SALES ADVISOR · KERETA IMPORT RECOND</div>
    <div class="rule"></div>
    <ul>
      <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#E10600"/><path d="M8.6 6.5c.4-.4 1-.4 1.3 0l1.3 1.6c.3.4.3.9 0 1.2l-.8.9c.6 1.3 1.6 2.3 2.9 2.9l.9-.8c.3-.3.8-.3 1.2 0l1.6 1.3c.4.3.4.9 0 1.3l-.9.9c-.6.6-1.6.8-2.4.4-2.6-1.2-4.7-3.3-5.9-5.9-.4-.8-.2-1.8.4-2.4z" fill="#fff"/></svg>018-777 3474</li>
      <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#0A1A33"/><path d="M13.3 5.5h2c.2 1.5 1.2 2.6 2.7 2.8v2c-1 0-2-.3-2.7-.8v4.3a3.8 3.8 0 1 1-3.8-3.8h.3v2.1a1.7 1.7 0 1 0 1.5 1.7z" fill="#fff"/></svg>@profpoji · Sentiasa Live</li>
      <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#0A1A33"/><circle cx="12" cy="12" r="6" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M6 12h12M12 6c-2 2-2 10 0 12M12 6c2 2 2 10 0 12" fill="none" stroke="#fff" stroke-width="1.3"/></svg>profpojikira.netlify.app</li>
      <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#0A1A33"/><path d="M5.5 14.5l1.2-3.6c.2-.6.8-1 1.4-1h7.8c.6 0 1.2.4 1.4 1l1.2 3.6v2.5h-13z" fill="#fff"/><circle cx="8.3" cy="17" r="1.4" fill="#E10600"/><circle cx="15.7" cy="17" r="1.4" fill="#E10600"/></svg>Japan · UK Recond Specialist</li>
    </ul>
    <div class="qr"><div class="box"><img src="qr.svg"></div><p>SCAN &amp; KIRA<br><em>BULANAN ANDA</em></p></div>
    <div class="bar"><span>KERETA PILIHAN ANDA, IKUT BAJET ANDA</span><b>#trustedSAever</b></div>
  </div>
</div></div>
</body></html>
