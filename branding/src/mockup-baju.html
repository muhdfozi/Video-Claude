<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Saira;font-weight:800;src:url(fonts/Saira_Condensed_wght_800.ttf)}
@font-face{font-family:Saira;font-weight:500;src:url(fonts/Saira_Condensed_wght_500.ttf)}
body{margin:0}
#stage{width:1800px;height:1100px;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,#f4f5f7 0%,#dfe2e7 60%,#c9cdd4 100%)}
.shirt{position:absolute;top:110px;width:600px;height:760px}
.label{position:absolute;top:860px;width:600px;text-align:center;font:800 30px Saira;letter-spacing:6px;color:#0A1A33}
.label small{display:block;font:500 20px Saira;letter-spacing:3px;color:#6b7280;margin-top:4px}
.title{position:absolute;left:0;right:0;top:34px;text-align:center;font:800 34px Saira;letter-spacing:8px;color:#0A1A33}
.title b{color:#E10600}
</style></head><body>
<div id="stage">
<div class="title">BAJU KORPORAT <b>PROFPOJI</b></div>
<!-- shared defs -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".28"/></filter>
    <filter id="emb"><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#000" flood-opacity=".5"/></filter>
    <filter id="knit"><feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" result="n"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .10"/></feComponentTransfer><feComposite in2="SourceGraphic" operator="in"/></filter>
    <linearGradient id="lightL" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".25" stop-color="#000" stop-opacity="0"/><stop offset=".55" stop-color="#fff" stop-opacity=".07"/><stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
    <path id="body" d="M245,68 L120,100 Q70,150 38,238 L100,272 L132,218 L130,668 Q300,686 470,668 L468,218 L500,272 L562,238 Q530,150 480,100 L355,68 Q300,92 245,68 Z"/>
    <path id="bodyBack" d="M245,62 L120,100 Q70,150 38,238 L100,272 L132,218 L130,672 Q300,690 470,672 L468,218 L500,272 L562,238 Q530,150 480,100 L355,62 Q300,74 245,62 Z"/>
    <clipPath id="clipF"><use href="#body"/></clipPath>
    <clipPath id="clipB"><use href="#bodyBack"/></clipPath>
  </defs>
</svg>

<!-- template rendered 3x by script below -->
<div id="shirts"></div>
<script>
const NAVY='#0A1A33', RED='#E10600';
function folds(o){return `
  <g filter="url(#soft)" opacity="${o}">
    <path d="M170,300 Q200,420 175,560" stroke="#000" stroke-width="16" fill="none" opacity=".35"/>
    <path d="M430,280 Q405,430 432,600" stroke="#000" stroke-width="14" fill="none" opacity=".3"/>
    <path d="M250,520 Q300,560 360,600" stroke="#000" stroke-width="12" fill="none" opacity=".25"/>
    <path d="M215,250 Q240,380 220,470" stroke="#fff" stroke-width="18" fill="none" opacity=".18"/>
    <path d="M380,330 Q360,420 385,520" stroke="#fff" stroke-width="16" fill="none" opacity=".15"/>
    <path d="M132,230 Q150,250 170,236" stroke="#000" stroke-width="10" fill="none" opacity=".4"/>
    <path d="M468,230 Q450,250 430,236" stroke="#000" stroke-width="10" fill="none" opacity=".4"/>
  </g>`}
function cuffs(c){return `
  <path d="M44,222 L106,256 L100,272 L38,238 Z" fill="${c.cuff}"/>
  <path d="M46,230 L104,262" stroke="${RED}" stroke-width="3"/>
  <path d="M556,222 L494,256 L500,272 L562,238 Z" fill="${c.cuff}"/>
  <path d="M554,230 L496,262" stroke="${RED}" stroke-width="3"/>
  <path d="M132,640 Q300,658 468,640" stroke="#000" stroke-opacity=".18" stroke-width="2" fill="none" stroke-dasharray="4 3"/>`}
function front(c){return `
<svg viewBox="0 0 600 760" width="600" height="760" filter="url(#drop)">
  <path d="M245,68 Q300,46 355,68 Q300,84 245,68 Z" fill="${c.inner}"/>
  <use href="#body" fill="${c.base}"/>
  <g clip-path="url(#clipF)">
    <rect width="600" height="760" fill="url(#lightL)"/>
    ${folds(c.fold)}
    <rect width="600" height="760" filter="url(#knit)" fill="#fff"/>
  </g>
  <rect x="284" y="96" width="32" height="150" rx="3" fill="${c.base}" stroke="#000" stroke-opacity=".25"/>
  <path d="M300,98 V246" stroke="#000" stroke-opacity=".18"/>
  ${[130,175,220].map(y=>`<circle cx="300" cy="${y}" r="6" fill="${c.button}" stroke="#000" stroke-opacity=".3"/><circle cx="298" cy="${y-1}" r="1.2" fill="#000" opacity=".4"/><circle cx="302" cy="${y+1}" r="1.2" fill="#000" opacity=".4"/>`).join('')}
  <path d="M245,68 Q240,90 258,146 L300,112 L300,92 Q268,90 245,68 Z" fill="${c.collar}" stroke="#000" stroke-opacity=".25"/>
  <path d="M355,68 Q360,90 342,146 L300,112 L300,92 Q332,90 355,68 Z" fill="${c.collar}" stroke="#000" stroke-opacity=".25"/>
  <path d="M252,96 Q256,120 262,138" stroke="${RED}" stroke-width="3" fill="none"/>
  <path d="M348,96 Q344,120 338,138" stroke="${RED}" stroke-width="3" fill="none"/>
  <path d="M258,146 L300,112 L342,146" fill="none" stroke="#000" stroke-opacity=".3" stroke-width="2" filter="url(#soft)"/>
  ${cuffs(c)}
  <image href="../logo/${c.chest}" x="345" y="182" width="120" filter="url(#emb)"/>
  <image href="../logo/${c.sleeveIcon}" x="60" y="172" width="44" transform="rotate(28 82 188)" filter="url(#emb)"/>
</svg>`}
function back(c){return `
<svg viewBox="0 0 600 760" width="600" height="760" filter="url(#drop)">
  <use href="#bodyBack" fill="${c.base}"/>
  <g clip-path="url(#clipB)">
    <rect width="600" height="760" fill="url(#lightL)"/>
    ${folds(c.fold)}
    <rect width="600" height="760" filter="url(#knit)" fill="#fff"/>
  </g>
  <path d="M245,62 Q300,74 355,62 L360,84 Q300,98 240,84 Z" fill="${c.collar}" stroke="#000" stroke-opacity=".25"/>
  <path d="M243,78 Q300,92 357,78" stroke="${RED}" stroke-width="3" fill="none"/>
  ${cuffs(c)}
  <image href="../logo/${c.back}" x="150" y="175" width="300" filter="url(#emb)"/>
  <text x="300" y="560" text-anchor="middle" font-family="Saira" font-weight="800" font-size="30" letter-spacing="4" fill="${c.text}">KERETA PILIHAN ANDA</text>
  <text x="300" y="596" text-anchor="middle" font-family="Saira" font-weight="500" font-size="24" letter-spacing="6" fill="${RED}">IKUT BAJET ANDA</text>
</svg>`}
const navy={base:NAVY,inner:'#050d1c',collar:'#0d2145',cuff:'#0d2145',button:'#e8e8e8',fold:.55,chest:'sulaman/sulaman-stacked-white.svg',sleeveIcon:'sulaman/sulaman-icon-white.svg',back:'logo-stacked-white.svg',text:'#fff'};
const white={base:'#f8f8f6',inner:'#d9d9d6',collar:NAVY,cuff:NAVY,button:'#ffffff',fold:.18,chest:'sulaman/sulaman-stacked-navy.svg',sleeveIcon:'sulaman/sulaman-icon-navy.svg',back:'logo-stacked.svg',text:NAVY};
const shirts=[[front(navy),'DEPAN','Navy · logo sulam dada kiri',0],[back(navy),'BELAKANG','Navy · cetakan belakang',600],[front(white),'DEPAN','Putih · versi alternatif',1200]];
document.getElementById('shirts').innerHTML=shirts.map(([s,l,sub,x])=>`<div class="shirt" style="left:${x}px">${s}</div><div class="label" style="left:${x}px">${l}<small>${sub}</small></div>`).join('');
</script>
</div>
</body></html>
